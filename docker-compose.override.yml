# Local-only: this PC cannot open TLS to the Supabase pooler.
# The rebuilt image still includes the Link column; data comes from the SQLite volume.
services:
  crm:
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      SONIC_DEBUG: "*"
      FINDER_LEAD_CAP: "10"
    volumes:
      - full_crm_data:/app/data

volumes:
  full_crm_data:
