name: full-crm

services:
  crm:
    container_name: full-crm
    image: full-crm:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/app/data/dev.db"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      CRM_TIMEZONE: ${CRM_TIMEZONE:-America/New_York}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_PHONE_NUMBER: ${TELNYX_PHONE_NUMBER:-}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:-}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      GROQ_API_KEY_1: ${GROQ_API_KEY_1:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CRM_API_KEY: ${CRM_API_KEY:-}
    volumes:
      - full_crm_data:/app/data
    restart: unless-stopped

  drip:
    container_name: full-crm-drip
    image: curlimages/curl:8.11.1
    network_mode: "service:crm"
    depends_on:
      - crm
    restart: unless-stopped
    command: ["sh", "-c", "sleep 10; while true; do curl -sf http://127.0.0.1:3000/api/cron/drip || true; sleep 8; done"]

volumes:
  full_crm_data:
